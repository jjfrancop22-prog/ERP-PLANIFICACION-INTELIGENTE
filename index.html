<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(console.warn));}let psiInstallPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();psiInstallPrompt=e;const b=document.getElementById('psi-install-app');if(b)b.hidden=false;});window.addEventListener('appinstalled',()=>{psiInstallPrompt=null;const b=document.getElementById('psi-install-app');if(b)b.hidden=true;});window.addEventListener('DOMContentLoaded',()=>{const b=document.createElement('button');b.id='psi-install-app';b.textContent='⬇ Instalar aplicación';b.hidden=true;b.type='button';b.setAttribute('aria-label','Instalar LAB-PSI en este equipo');b.style.cssText='position:fixed;right:16px;bottom:16px;z-index:99990;padding:11px 16px;border:0;border-radius:12px;background:#146d9b;color:#fff;font:600 14px system-ui;box-shadow:0 6px 22px #001a3455;cursor:pointer';b.onclick=async()=>{if(!psiInstallPrompt)return;const prompt=psiInstallPrompt;psiInstallPrompt=null;await prompt.prompt();await prompt.userChoice;b.hidden=true};document.body.appendChild(b);});</script>
