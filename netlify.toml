[build]
command = "npm run build"
publish = "dist"
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/version.json"
[headers.values]
Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
for = "/index.html"
[headers.values]
Cache-Control = "no-cache, must-revalidate"
